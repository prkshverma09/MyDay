<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Stream chunk</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <header>
      <h1>Stream chunk</h1>
      <p class="lede">Record the camera in 15 second pieces, or choose a video file.</p>
    </header>

    <p id="status" aria-live="polite">Ready</p>
    <p id="error" role="alert"></p>

    <section id="live">
      <video id="preview" playsinline webkit-playsinline autoplay muted></video>
      <p id="timer">0:00</p>
      <button id="record" type="button">Record</button>
      <button id="flip" type="button">Flip camera</button>
    </section>

    <p id="live-unavailable" hidden>Live recording is unavailable.</p>

    <button id="stop" type="button" disabled>Stop</button>

    <section id="file-section">
      <label for="file">Video file</label>
      <input id="file" type="file" accept="video/*">
      <p class="hint">After a file upload, Stop finishes the session.</p>
    </section>

    <section id="chunk-section">
      <h2>Chunks</h2>
      <p id="empty-chunks" class="hint">No chunks yet.</p>
      <ol id="chunks"></ol>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
