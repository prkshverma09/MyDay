[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-chunk"
version = "0.1.0"
description = "HTTP API that stores uploaded video and cuts it into timed MP4 chunks."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stream-chunk = "stream_chunk.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../video-chunker/src"]
testpaths = ["tests"]
